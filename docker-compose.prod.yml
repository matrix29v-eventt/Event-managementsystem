# Production-like LOCAL deployment — same shape as staging plus prod safeguards.
# This is NOT real production infrastructure (single host, no TLS, no multi-node HA).
# Usage:  IMAGE_TAG=<image> APP_PORT=8002 ./scripts/deploy.sh prod
name: ems-prod

services:
  postgres_db:
    image: postgres:14-alpine
    container_name: ems_prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ems_prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data/
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${IMAGE_TAG:?IMAGE_TAG is required (commit-SHA tag, e.g. ghcr.io/owner/repo/ems-api:abc123)}
    container_name: ems_prod_api
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db/${POSTGRES_DB:-ems_prod}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required in production}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prod_postgres_data:
