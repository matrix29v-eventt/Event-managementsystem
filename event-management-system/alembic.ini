[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
version_locations = %(script_location)s/versions
prepend_sys_path = .

# URL is configured dynamically via env.py using DATABASE_URL from .env
sqlalchemy.url =

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
