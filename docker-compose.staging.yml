# Staging stack — mirrors production shape with staging-specific values.
# Usage:  IMAGE_TAG=<image> APP_PORT=8001 ./scripts/deploy.sh staging
#         docker compose -f docker-compose.staging.yml up -d
name: ems-staging

services:
  postgres_db:
    image: postgres:14-alpine
    container_name: ems_staging_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ems_staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped

  api:
    image: ${IMAGE_TAG:?IMAGE_TAG is required (commit-SHA tag, e.g. ghcr.io/owner/repo/ems-api:abc123)}
    container_name: ems_staging_api
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db/${POSTGRES_DB:-ems_staging}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: staging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      # python:3.11-slim has no curl; use stdlib so no extra package is needed.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  staging_postgres_data:
