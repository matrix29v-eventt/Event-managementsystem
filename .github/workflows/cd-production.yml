# CD — production-like. Manual gate (environment protection rule) + exact SHA image.
name: CD Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full image ref to deploy, e.g. ghcr.io/<owner>/<repo>/ems-api:<sha>"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ems-api

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./event-management-system
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to production-like
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy production-like stack
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.publish.outputs.image }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        run: |
          chmod +x scripts/deploy.sh scripts/smoke_test.sh
          IMAGE_TAG="$IMAGE_TAG" APP_PORT=8002 scripts/deploy.sh prod
