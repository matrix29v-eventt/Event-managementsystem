# CI — validation, tests, Docker build. No deployment happens here.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate-and-test:
    name: Validate & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-management-system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: event-management-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax / import validation
        run: python -m compileall -q app tests

      - name: Lint (Ruff)
        # Scoped to E9 (syntax) + F (pyflakes): the full default ruleset flags
        # idiomatic FastAPI patterns (e.g. B008 on Depends defaults) across the
        # pre-existing codebase, so the gate targets real defects instead.
        run: ruff check app tests --select E9,F

      - name: Run tests
        env:
          # Import-time DATABASE_URL plus isolated SQLite test database.
          DATABASE_URL: sqlite:///./test.db
          TEST_DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./event-management-system
          push: false
          tags: ems-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
